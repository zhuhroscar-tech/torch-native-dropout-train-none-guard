[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-native-dropout-train-none-guard"
version = "0.1.0"
description = "Guards a real torch.compile (Inductor) vs eager divergence in aten.native_dropout's undocumented train=None argument (pytorch/pytorch#197846), plus discloses a related MPS-vs-CPU eager divergence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/torch-native-dropout-train-none-guard"

[project.scripts]
torch-native-dropout-train-none-guard = "torch_native_dropout_train_none_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
